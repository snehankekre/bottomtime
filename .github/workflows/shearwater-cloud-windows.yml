name: shearwater cloud on windows

# Installs Shearwater Cloud's Windows app, opens it without signing in, and
# checks that it made its users folder where bottomtime looks for it. Run by
# hand, since it downloads Shearwater's installer.

on: workflow_dispatch

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Install Shearwater Cloud
        shell: pwsh
        run: |
          $url = (Invoke-RestMethod https://downloads.shearwater.com/cloud_reference.json).swcloud_exe
          "installer: $url"
          Invoke-WebRequest $url -OutFile swc.exe
          Start-Process swc.exe -ArgumentList /S -Wait
      - name: Open it for a minute
        shell: pwsh
        run: |
          $exe = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Recurse -Filter "Shearwater*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "unins" } | Select-Object -First 1
          "app: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 60
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screen.png")
          Stop-Process $p -ErrorAction SilentlyContinue
      - name: What it wrote
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE\AppData\LocalLow" -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "--- every dive_data.db under the user profile:"
          Get-ChildItem $env:USERPROFILE -Recurse -Filter dive_data.db -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - name: bottomtime looks in the same place
        run: python -c "from bottomtime.app import CLOUD_USERS as u; print(u, u.is_dir()); raise SystemExit(0 if u.is_dir() else 1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen
          path: screen.png
